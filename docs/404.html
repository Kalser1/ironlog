<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LiftBook — страница не найдена</title>
  <link rel="icon" href="img/icon.png" />
  <style>
    @font-face {
      font-family: "Neucha";
      src: url("fonts/Neucha.ttf") format("truetype");

    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #2e2a22;
      font-family: "Neucha", "Comic Sans MS", cursive;

    }
    .card {
      max-width: 520px;
      padding: 34px 30px;
      text-align: center;
      background: #fffdf5;
      border: 2px solid #2e2a22;
      border-radius: 18px 22px 16px 24px;
      box-shadow: 5px 6px 0 rgba(46, 42, 34, 0.18);
      transform: rotate(-0.5deg);
    }
    h1 { margin: 0 0 8px; font-size: 54px; line-height: 1; }
    p { margin: 0 0 22px; color: #6f6858; }
    a {
      display: inline-block;
      padding: 11px 22px;
      color: #2e2a22;
      text-decoration: none;
      background: #8cc63f;
      border: 2px solid #2e2a22;
      border-radius: 14px 18px 12px 20px;
      box-shadow: 4px 5px 0 rgba(46, 42, 34, 0.18);

</head>

  <div class="card">
